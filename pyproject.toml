[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-copilot"
version = "0.1.0"
description = "Enterprise Procurement Copilot – agentic RAG, NL-to-SQL, and GraphRAG over FAR policy and USAspending data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3,<0.4",
    "langgraph>=0.2,<0.4",
    "langchain-openai>=0.2,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "duckdb>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "pypdf>=5.0,<6",
    "bytez>=1,<2",
    "langchain-ollama>=0.2,<0.3",
    "langchain-groq>=0.2,<0.4",
    "langchain-google-genai>=2.1,<3",
    "langfuse>=4,<5",
    "qdrant-client>=1.11,<2",
    "fastembed>=0.4,<1",
    "sentence-transformers>=3,<4",
    "slowapi>=0.1,<1",
    # Pinned to the 0.2.x line deliberately: ragas>=0.3 pulls datasets>=4.0,
    # which requires huggingface-hub>=1.0 — incompatible with the
    # huggingface-hub<1.0 ceiling that transformers/sentence-transformers
    # (our Day-3 reranker) and fastembed both need. 0.2.x avoids the conflict.
    "ragas>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "black>=24,<26",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
